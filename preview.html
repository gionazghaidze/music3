    // API სერვისი (Promise)
    const fetchSongsApi = async (category = "all", searchQuery = "") => {
      return new Promise((resolve) => {
        setTimeout(() => {
          let filtered = [...INITIAL_SONGS];
          if (category === "popular") {
            filtered = filtered.filter((s) => s.isPopular);
          } else if (category !== "all") {
            filtered = filtered.filter((s) => s.mood === category || s.genre.toLowerCase().includes(category.toLowerCase()));
          }
          if (searchQuery.trim() !== "") {
            const query = searchQuery.toLowerCase();
            filtered = filtered.filter((s) =>
              s.title.toLowerCase().includes(query) ||
              s.artist.toLowerCase().includes(query) ||
              s.genre.toLowerCase().includes(query)
            );
          }
          resolve({ status: 200, data: filtered });
        }, 300);
      });
    };

    const getSmartRecommendationApi = async (preferredMood = null) => {
      return new Promise((resolve) => {
        setTimeout(() => {
          let pool = INITIAL_SONGS;
          if (preferredMood && preferredMood !== "all") {
            const matching = INITIAL_SONGS.filter((s) => s.mood === preferredMood);
            if (matching.length > 0) pool = matching;
          }
          const chosen = pool[Math.floor(Math.random() * pool.length)];
          resolve({ status: 200, recommendedSong: chosen });
        }, 250);
      });
    };

    // 3. კომპონენტი: AuthModal (Sign In / Log In მოდალი)
    function AuthModal({ isOpen, initialMode = 'login', onClose, onAuthSuccess }) {
      const [mode, setMode] = useState(initialMode);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');

      useEffect(() => { setMode(initialMode); }, [initialMode]);
      useEffect(() => {
        const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
        if (isOpen) window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        const displayName = mode === 'signin' ? (name || 'მომხმარებელი') : (email.split('@')[0] || 'მომხმარებელი');
        onAuthSuccess({ name: displayName, email: email || 'user@melomix.ge', avatar: '🎧' });
        onClose();
      };

      return (
        <div className="auth-overlay" onClick={onClose}>
          <div className="auth-modal" onClick={(e) => e.stopPropagation()}>
            <button className="auth-close-btn" onClick={onClose}>✕</button>
            <div className="auth-header">
              <div className="auth-header-icon">🎵</div>
              <h3>{mode === 'login' ? 'სისტემაში შესვლა' : 'ანგარიშის შექმნა'}</h3>
              <p>{mode === 'login' ? 'შედით Melomix-ში თქვენი რჩეული მუსიკების შესანახად' : 'დარეგისტრირდით და მიიღეთ პერსონალური რეკომენდაციები'}</p>
            </div>

            <div className="auth-tabs">
              <button
                type="button"
                className={`auth-tab-btn ${mode === 'login' ? 'active' : ''}`}
                onClick={() => setMode('login')}
              >
                Log In
              </button>
              <button
                type="button"
                className={`auth-tab-btn ${mode === 'signin' ? 'active' : ''}`}
                onClick={() => setMode('signin')}
              >
                Sign In
              </button>
            </div>

            <form className="auth-form" onSubmit={handleSubmit}>
              {mode === 'signin' && (
                <div className="form-group">
                  <label>თქვენი სახელი</label>
                  <input
                    type="text"
                    className="form-input"
                    placeholder="მაგ: ნათია"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    required
                  />
                </div>
              )}
              <div className="form-group">
                <label>ელ-ფოსტა</label>
                <input
                  type="email"
                  className="form-input"
                  placeholder="name@example.com"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  required
                />
              </div>
              <div className="form-group">
                <label>პაროლი</label>
                <input
                  type="password"
                  className="form-input"
                  placeholder="••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  required
                />
              </div>
              <button type="submit" className="auth-submit-btn">
                {mode === 'login' ? 'Log In ➔' : 'Sign In ➔'}
              </button>
            </form>
            <p className="demo-account-hint">💡 შეგიძლიათ შეიყვანოთ ნებისმიერი სატესტო მონაცემი</p>
          </div>
        </div>
      );
    }

              <button
                className={`btn-icon-rec favorite ${isFavorite ? 'active' : ''}`}
                onClick={() => onToggleFavorite(song.id)}
              >
                {isFavorite ? '❤️' : '🤍'}
              </button>
              <button className="btn-icon-rec" onClick={() => onViewDetails(song)}>ℹ️</button>
            </div>
          </div>
        </div>
      );
    }

    // 7. კომპონენტი: MusicCard
    function MusicCard({ song, isCurrent, isPlaying, isFavorite, onPlay, onToggleFavorite, onViewDetails }) {
      const isCurrentlyPlaying = isCurrent && isPlaying;
      return (
        <article className={`music-card ${isCurrentlyPlaying ? 'playing' : ''}`}>
          <div className="card-cover-container">
            <img src={song.coverUrl} alt={song.title} className="card-img" />
            <button
              className={`fav-float-btn ${isFavorite ? 'active' : ''}`}
              onClick={(e) => { e.stopPropagation(); onToggleFavorite(song.id); }}
            >
              {isFavorite ? '❤️' : '🤍'}
            </button>
            <div className={`card-overlay ${isCurrentlyPlaying ? 'active' : ''}`}>
              <button className="card-play-btn" onClick={() => onPlay(song)}>
                {isCurrentlyPlaying ? '⏸' : '▶'}
              </button>
            </div>
          </div>
          <div className="card-body">
            <div className="card-header-row">
              <h4 className="card-title">{song.title}</h4>
            </div>
            <p className="card-artist">{song.artist}</p>
            <div className="card-tags">
              <span className="tag-badge mood">✨ {song.mood}</span>
              <span className="tag-badge">{song.genre}</span>
            </div>
            <div className="card-footer">
              <span>⏱ {song.duration}</span>
              <span>⭐ {song.rating}</span>
              <button className="card-details-link" onClick={() => onViewDetails(song)}>დეტალები ➔</button>
            </div>
          </div>
        </article>
      );
    }

    // 8. კომპონენტი: MusicList (.map() მეთოდით)
    function MusicList({ songs, currentTrack, isPlaying, favorites, onPlaySong, onToggleFavorite, onViewDetails, loading, title, onResetFilters }) {
      return (
        <section className="music-list-section">
          <div className="list-header">
            <h3 className="list-title"><span>🎵</span> {title}</h3>
            <span className="list-count">სულ: {songs.length} კომპოზიცია</span>
          </div>

          {loading ? (
            <div className="loading-container">
              <div className="spinner"></div>
              <p>მუსიკების ბაზა იტვირთება API-დან...</p>
            </div>
          ) : songs.length === 0 ? (
            <div className="empty-state">
              <div className="empty-icon">🔍</div>
              <h4 className="empty-title">მუსიკა ვერ მოიძებნა</h4>
              <p className="empty-desc">სცადეთ სხვა საძიებო სიტყვა ან შეცვალეთ განწყობა.</p>
              {onResetFilters && (
                <button className="btn-reset" onClick={onResetFilters}>ყველა მუსიკის ნახვა</button>
              )}
            </div>
          ) : (
            <div className="music-grid">
              {songs.map((song) => (
                <MusicCard
                  key={song.id}
                  song={song}
                  isCurrent={currentTrack?.id === song.id}
                  isPlaying={isPlaying}
                  isFavorite={favorites.includes(song.id)}
                  onPlay={onPlaySong}
                  onToggleFavorite={onToggleFavorite}
                  onViewDetails={onViewDetails}
                />
              ))}
            </div>
          )}
        </section>
      );
    }

    // 9. კომპონენტი: MusicModal
    function MusicModal({ song, onClose, isPlaying, currentTrack, onPlay, isFavorite, onToggleFavorite }) {
      useEffect(() => {
        const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [onClose]);

      if (!song) return null;
      const isCurrentSongPlaying = currentTrack?.id === song.id && isPlaying;

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close-btn" onClick={onClose}>✕</button>
            <div className="modal-header-section">
              <img src={song.coverUrl} alt={song.title} className="modal-cover-img" />
              <div className="modal-meta-info">
                <h3 className="modal-song-title">{song.title}</h3>
                <p className="modal-song-artist">{song.artist} • {song.album} ({song.year})</p>
                <div className="modal-tags">
                  <span className="modal-tag">🎭 {song.mood}</span>
                  <span className="modal-tag">🎸 {song.genre}</span>
                  <span className="modal-tag">⏱ {song.duration}</span>
                  <span className="modal-tag">⭐ {song.rating} / 5.0</span>
                </div>
              </div>
            </div>
            <div className="modal-body-section">
              <div className="info-block">
                <h6>💡 რატომ გირჩევთ ამ მუსიკას:</h6>
                <p>{song.whyRecommended}</p>
              </div>
              <div className="info-block">
                <h6>📖 კომპოზიციის შესახებ:</h6>
                <p>{song.description}</p>
              </div>
            </div>
            <div className="modal-actions">
              <button className="btn-modal-play" onClick={() => onPlay(song)}>
                <span>{isCurrentSongPlaying ? '⏸' : '▶'}</span>
                <span>{isCurrentSongPlaying ? 'შეჩერება' : 'მოსმენა'}</span>
              </button>
              <button className={`btn-modal-fav ${isFavorite ? 'active' : ''}`} onClick={() => onToggleFavorite(song.id)}>
                <span>{isFavorite ? '❤️' : '🤍'}</span>
                <span>{isFavorite ? 'რჩეულებშია' : 'რჩეულებში დამატება'}</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 10. კომპონენტი: StatsBar (.map() მეთოდით)
    function StatsBar({ totalSongs, favoritesCount, activeMood, popularCount }) {
      const stats = [
        { id: 1, icon: "🎵", value: totalSongs, label: "სულ სიმღერა" },
        { id: 2, icon: "🔥", value: popularCount, label: "ტოპ ჰიტი" },
        { id: 3, icon: "❤️", value: favoritesCount, label: "შენი რჩეული" },
        { id: 4, icon: "✨", value: activeMood === "all" ? "ყველა" : activeMood, label: "აქტიური განწყობა" }
      ];

      return (
        <div className="stats-bar-container">
          {stats.map((item) => (
            <div key={item.id} className="stat-card">
              <div className="stat-icon">{item.icon}</div>
              <div className="stat-info">
                <span className="stat-value">{item.value}</span>
                <span className="stat-label">{item.label}</span>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // 11. კომპონენტი: Player (useState, useEffect, Audio)
    function Player({ currentTrack, isPlaying, onTogglePlay, onNext, onPrev, isFavorite, onToggleFavorite }) {
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(0.8);
      const [isMuted, setIsMuted] = useState(false);
      const audioRef = useRef(null);

      useEffect(() => {
        if (!audioRef.current || !currentTrack) return;
        if (isPlaying) {
          audioRef.current.play().catch((err) => console.log(err));
        } else {
          audioRef.current.pause();
        }
      }, [isPlaying, currentTrack]);

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = isMuted ? 0 : volume;
        }
      }, [volume, isMuted]);

      if (!currentTrack) return null;

      const formatTime = (timeInSec) => {
        if (isNaN(timeInSec)) return "0:00";
        const m = Math.floor(timeInSec / 60);
        const s = Math.floor(timeInSec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      return (
        <div className="music-player-bar">
          <audio
            ref={audioRef}
            src={currentTrack.audioUrl}
            onTimeUpdate={() => audioRef.current && setCurrentTime(audioRef.current.currentTime)}
            onLoadedMetadata={() => audioRef.current && setDuration(audioRef.current.duration || 0)}
            onEnded={onNext}
          />
          <div className="player-track-info">
            <div className="player-cover-wrap">
              <img src={currentTrack.coverUrl} alt={currentTrack.title} className="player-cover" />
              {isPlaying && (
                <div className="equalizer">
                  <span className="eq-bar"></span>
                  <span className="eq-bar"></span>
                  <span className="eq-bar"></span>
                  <span className="eq-bar"></span>
                </div>
              )}
            </div>
            <div className="player-text">
              <h5 className="player-title">{currentTrack.title}</h5>
              <p className="player-artist">{currentTrack.artist}</p>
            </div>
            <button
              className={`player-fav-btn ${isFavorite ? 'active' : ''}`}
              onClick={() => onToggleFavorite(currentTrack.id)}
            >
              {isFavorite ? '❤️' : '🤍'}
            </button>
          </div>

          <div className="player-controls">
            <div className="control-buttons">
              <button className="ctrl-btn" onClick={onPrev}>⏮</button>
              <button className="play-toggle-btn" onClick={onTogglePlay}>
                {isPlaying ? '⏸' : '▶'}
              </button>
              <button className="ctrl-btn" onClick={onNext}>⏭</button>
            </div>
            <div className="progress-container">
              <span className="time-text">{formatTime(currentTime)}</span>
              <input
                type="range"
                className="progress-bar-slider"
                min="0"
                max={duration || 100}
                value={currentTime}
                onChange={(e) => {
                  const val = Number(e.target.value);
                  setCurrentTime(val);
                  if (audioRef.current) audioRef.current.currentTime = val;
                }}
              />
              <span className="time-text">{formatTime(duration)}</span>
            </div>
          </div>

          <div className="player-volume-wrapper">
            <button className="vol-icon-btn" onClick={() => setIsMuted(!isMuted)}>
              {isMuted || volume === 0 ? '🔇' : volume < 0.5 ? '🔉' : '🔊'}
            </button>
            <input
              type="range"
              className="volume-slider"
              min="0"
              max="1"
              step="0.05"
              value={isMuted ? 0 : volume}
              onChange={(e) => {
                setVolume(Number(e.target.value));
                setIsMuted(false);
              }}
            />
          </div>
        </div>
      );
    }

    // 12. მთავარი App კომპონენტი (Parent)
    function App() {
      const [songs, setSongs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeTab, setActiveTab] = useState('home');
      const [recommendedSong, setRecommendedSong] = useState(null);
      const [recLoading, setRecLoading] = useState(false);
      const [currentTrack, setCurrentTrack] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [favorites, setFavorites] = useState(() => {
        try {
          const s = localStorage.getItem('melomix_favs');
          return s ? JSON.parse(s) : [1, 3, 14];
        } catch { return [1, 3, 14]; }
      });
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const u = localStorage.getItem('melomix_user');
          return u ? JSON.parse(u) : null;
        } catch { return null; }
      });
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [modalSong, setModalSong] = useState(null);
      const [toast, setToast] = useState('');

      useEffect(() => {
        let mounted = true;
        setLoading(true);
        fetchSongsApi(selectedCategory, searchQuery).then((res) => {
          if (mounted) {
            setSongs(res.data);
            setLoading(false);
          }
        });
        return () => { mounted = false; };
      }, [selectedCategory, searchQuery]);

      useEffect(() => {
        handleGenerateRec();
      }, []);

      useEffect(() => {
        try { localStorage.setItem('melomix_favs', JSON.stringify(favorites)); } catch {}
      }, [favorites]);

      useEffect(() => {
        try {
          if (currentUser) localStorage.setItem('melomix_user', JSON.stringify(currentUser));
          else localStorage.removeItem('melomix_user');
        } catch {}
      }, [currentUser]);

      useEffect(() => {
        if (currentTrack && isPlaying) {
          document.title = `▶ ${currentTrack.title} - ${currentTrack.artist} | Melomix`;
        } else {
          document.title = "Melomix - მუსიკების შემომთავაზებელი & ამრჩევი";
        }
      }, [currentTrack, isPlaying]);

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2500);
      };

      const handleGenerateRec = async (mood = selectedCategory) => {
        setRecLoading(true);
        const res = await getSmartRecommendationApi(mood);
        setRecommendedSong(res.recommendedSong);
        setRecLoading(false);
      };

      const handlePlaySong = (song) => {
        if (currentTrack?.id === song.id) {
          setIsPlaying(!isPlaying);
        } else {
          setCurrentTrack(song);
          setIsPlaying(true);
          showNotification(`უკრავს: ${song.title} - ${song.artist}`);
        }
      };

      const handleNext = () => {
        if (!currentTrack || songs.length === 0) return;
        const i = songs.findIndex((s) => s.id === currentTrack.id);
        setCurrentTrack(songs[(i + 1) % songs.length]);
        setIsPlaying(true);
      };

      const handlePrev = () => {
        if (!currentTrack || songs.length === 0) return;
        const i = songs.findIndex((s) => s.id === currentTrack.id);
        setCurrentTrack(songs[(i - 1 + songs.length) % songs.length]);
        setIsPlaying(true);
      };

      const handleToggleFav = (id) => {
        setFavorites((prev) => {
          if (prev.includes(id)) {
            showNotification("ამოიშალა რჩეულებიდან");
            return prev.filter((x) => x !== id);
          } else {
            showNotification("დაემატა რჩეულებში! ❤️");
            return [...prev, id];
          }
        });
      };

      const handleOpenLogin = () => {
        setAuthMode('login');
        setIsAuthModalOpen(true);
      };

      const handleOpenSignIn = () => {
        setAuthMode('signin');
        setIsAuthModalOpen(true);
      };

      const handleAuthSuccess = (u) => {
        setCurrentUser(u);
        showNotification(`კეთილი იყოს თქვენი მობრძანება, ${u.name}! 👋`);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        showNotification("სისტემიდან გამოხვედით");
      };

      const favoriteSongs = INITIAL_SONGS.filter((s) => favorites.includes(s.id));

      return (
        <div className="app-container">
          <Navbar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            favoritesCount={favorites.length}
            user={currentUser}
            onOpenLogin={handleOpenLogin}
            onOpenSignIn={handleOpenSignIn}
            onLogout={handleLogout}
          />

          <main className="main-content">
            {activeTab === 'home' && (
              <>
                <HeroBanner
                  onFindRecommendation={() => setActiveTab('recommender')}
                  onSelectPopular={() => setSelectedCategory('popular')}
                  onSurpriseMe={() => {
                    const rnd = INITIAL_SONGS[Math.floor(Math.random() * INITIAL_SONGS.length)];
                    handlePlaySong(rnd);
                  }}
                />

                <MoodSelector
                  categories={MOOD_CATEGORIES}
                  selectedCategory={selectedCategory}
                  onSelectCategory={(id) => {
                    setSelectedCategory(id);
                    handleGenerateRec(id);
                  }}
                />

                <RecommendationBox
                  song={recommendedSong}
                  isPlaying={isPlaying}
                  currentTrack={currentTrack}
                  onPlay={handlePlaySong}
                  onRefresh={() => handleGenerateRec(selectedCategory)}
                  isFavorite={favorites.includes(recommendedSong?.id)}
                  onToggleFavorite={handleToggleFav}
                  onViewDetails={(s) => setModalSong(s)}
                  loading={recLoading}
                />

                <MusicList
                  songs={songs}
                  currentTrack={currentTrack}
                  isPlaying={isPlaying}
                  favorites={favorites}
                  onPlaySong={handlePlaySong}
                  onToggleFavorite={handleToggleFav}
                  onViewDetails={(s) => setModalSong(s)}
                  loading={loading}
                  title={
                    searchQuery
                      ? `ძიების შედეგები ("${searchQuery}")`
                      : selectedCategory === 'all'
                      ? 'პოპულარული და რეკომენდებული მუსიკები'
                      : `კატეგორია: ${selectedCategory}`
                  }
                  onResetFilters={() => {
                    setSelectedCategory('all');
                    setSearchQuery('');
                  }}
                />
              </>
            )}

            {activeTab === 'recommender' && (
              <div className="tab-view">
                <div className="view-header">
                  <div>
                    <h2 className="view-heading">✨ ჭკვიანი მუსიკალური ამრჩევი</h2>
                    <p className="view-sub">მიიღეთ პერსონალიზებული რეკომენდაცია განწყობის მიხედვით</p>
                  </div>
                </div>

                <MoodSelector
                  categories={MOOD_CATEGORIES}
                  selectedCategory={selectedCategory}
                  onSelectCategory={(id) => {
                    setSelectedCategory(id);
                    handleGenerateRec(id);
                  }}
                />

                <RecommendationBox
                  song={recommendedSong}
                  isPlaying={isPlaying}
                  currentTrack={currentTrack}
                  onPlay={handlePlaySong}
                  onRefresh={() => handleGenerateRec(selectedCategory)}
                  isFavorite={favorites.includes(recommendedSong?.id)}
                  onToggleFavorite={handleToggleFav}
                  onViewDetails={(s) => setModalSong(s)}
                  loading={recLoading}
                />

                <MusicList
                  songs={songs.filter((s) => s.id !== recommendedSong?.id)}
                  currentTrack={currentTrack}
                  isPlaying={isPlaying}
                  favorites={favorites}
                  onPlaySong={handlePlaySong}
                  onToggleFavorite={handleToggleFav}
                  onViewDetails={(s) => setModalSong(s)}
                  loading={loading}
                  title="დამატებითი რეკომენდაციები ამ განწყობისთვის"
                />
              </div>
            )}

            {activeTab === 'favorites' && (
              <div className="tab-view">
                <div className="view-header">
                  <div>
                    <h2 className="view-heading">❤️ შენი რჩეული სიმღერები</h2>
                    <p className="view-sub">თქვენ მიერ მოწონებული სიმღერების კოლექცია</p>
                  </div>
                </div>

                <MusicList
                  songs={favoriteSongs}
                  currentTrack={currentTrack}
                  isPlaying={isPlaying}
                  favorites={favorites}
                  onPlaySong={handlePlaySong}
                  onToggleFavorite={handleToggleFav}
                  onViewDetails={(s) => setModalSong(s)}
                  loading={false}
                  title="რჩეულები"
                  onResetFilters={() => setActiveTab('home')}
                />
              </div>
            )}

            {activeTab === 'stats' && (
              <div className="tab-view">
                <div className="view-header">
                  <div>
                    <h2 className="view-heading">📊 მუსიკალური ანალიტიკა</h2>
                    <p className="view-sub">საიტის მონაცემთა ბაზისა და თქვენი აქტივობის სტატისტიკა</p>
                  </div>
                </div>

                <StatsBar
                  totalSongs={INITIAL_SONGS.length}
                  favoritesCount={favorites.length}
                  activeMood={selectedCategory}
                  popularCount={INITIAL_SONGS.filter((s) => s.isPopular).length}
                />

                <MusicList
                  songs={INITIAL_SONGS.filter((s) => s.isPopular)}
                  currentTrack={currentTrack}
                  isPlaying={isPlaying}
                  favorites={favorites}
                  onPlaySong={handlePlaySong}
                  onToggleFavorite={handleToggleFav}
                  onViewDetails={(s) => setModalSong(s)}
                  loading={false}
                  title="ყველა დროის ყველაზე პოპულარული ჰიტები"
                />
              </div>
            )}
          </main>

          {modalSong && (
            <MusicModal
              song={modalSong}
              onClose={() => setModalSong(null)}
              isPlaying={isPlaying}
              currentTrack={currentTrack}
              onPlay={handlePlaySong}
              isFavorite={favorites.includes(modalSong.id)}
              onToggleFavorite={handleToggleFav}
            />
          )}

          <AuthModal
            isOpen={isAuthModalOpen}
            initialMode={authMode}
            onClose={() => setIsAuthModalOpen(false)}
            onAuthSuccess={handleAuthSuccess}
          />

          <Player
            currentTrack={currentTrack}
            isPlaying={isPlaying}
            onTogglePlay={() => setIsPlaying(!isPlaying)}
            onNext={handleNext}
            onPrev={handlePrev}
            isFavorite={favorites.includes(currentTrack?.id)}
            onToggleFavorite={handleToggleFav}
          />

          {toast && (
            <div className="toast-notice">
              <span>🔔</span> <span>{toast}</span>
            </div>
          )}

          <footer className="app-footer">
            <p>Melomix © 2026 — მუსიკების შემომთავაზებელი და ამრჩევი პლატფორმა • შექმნილია React-ზე</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
